[package]
name = "jaymi"
description = "Jaymi desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "jaymi"
path = "src/lib.rs"

[[bin]]
name = "jaymi"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.45"
rfd = "0.15"
jaymi-capabilities = { workspace = true }
jaymi-commands = { workspace = true }
jaymi-config = { workspace = true }
jaymi-context = { workspace = true }
jaymi-core = { workspace = true }
jaymi-database = { workspace = true }
jaymi-discovery = { workspace = true }
jaymi-knowledge = { workspace = true }
jaymi-logging = { workspace = true }
jaymi-memory = { workspace = true }
jaymi-memory-engine = { workspace = true }
jaymi-parsers = { workspace = true }
jaymi-permissions = { workspace = true }
jaymi-planner = { workspace = true }
jaymi-policies = { workspace = true }
jaymi-project-engine = { workspace = true }
jaymi-projects = { workspace = true }
jaymi-providers = { workspace = true }
jaymi-reasoning = { workspace = true }
jaymi-reasoning-ollama = { workspace = true }
jaymi-search = { workspace = true }
jaymi-tools = { workspace = true }
jaymi-understanding = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSColorSpace"] }

[dev-dependencies]
jaymi-capabilities = { workspace = true }
jaymi-commands = { workspace = true }
jaymi-config = { workspace = true }
jaymi-context = { workspace = true }
jaymi-core = { workspace = true }
jaymi-database = { workspace = true }
jaymi-discovery = { workspace = true }
jaymi-knowledge = { workspace = true }
jaymi-logging = { workspace = true }
jaymi-memory = { workspace = true }
jaymi-memory-engine = { workspace = true }
jaymi-parsers = { workspace = true }
jaymi-permissions = { workspace = true }
jaymi-planner = { workspace = true }
jaymi-policies = { workspace = true }
jaymi-project-engine = { workspace = true }
jaymi-projects = { workspace = true }
jaymi-providers = { workspace = true }
jaymi-search = { workspace = true }
jaymi-tools = { workspace = true }
jaymi-understanding = { workspace = true }
