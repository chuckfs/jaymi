[package]
name = "jaymi"
description = "Jaymi desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "jaymi"
path = "src/lib.rs"

[[bin]]
name = "jaymi"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
jaymi-capabilities = { workspace = true }
jaymi-config = { workspace = true }
jaymi-context = { workspace = true }
jaymi-core = { workspace = true }
jaymi-database = { workspace = true }
jaymi-logging = { workspace = true }
jaymi-memory = { workspace = true }
jaymi-parsers = { workspace = true }
jaymi-permissions = { workspace = true }
jaymi-planner = { workspace = true }
jaymi-policies = { workspace = true }
jaymi-providers = { workspace = true }
jaymi-tools = { workspace = true }

[dev-dependencies]
jaymi-capabilities = { workspace = true }
jaymi-config = { workspace = true }
jaymi-core = { workspace = true }
jaymi-database = { workspace = true }
jaymi-logging = { workspace = true }
jaymi-permissions = { workspace = true }
jaymi-planner = { workspace = true }
jaymi-policies = { workspace = true }
jaymi-providers = { workspace = true }
jaymi-tools = { workspace = true }
