<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaymi Monaco</title>
  <style>
    html, body, #container {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="./vs/loader.js"></script>
  <script>
    (function () {
      const ipc = (payload) => {
        try {
          window.ipc.postMessage(JSON.stringify(payload));
        } catch (err) {
          console.error("ipc failed", err);
        }
      };

      let editor = null;
      let currentPath = "";
      let applyingExternal = false;
      let scrollTimer = null;
      let cursorTimer = null;
      let foldsTimer = null;
      let nextRequestId = 1;
      const pending = {};

      function collectFoldedRegions() {
        if (!editor) {
          return [];
        }
        const contribution = editor.getContribution("editor.contrib.folding");
        if (!contribution || typeof contribution.getFoldingModel !== "function") {
          return [];
        }
        const modelPromise = contribution.getFoldingModel();
        if (!modelPromise || typeof modelPromise.then !== "function") {
          return [];
        }
        // Synchronous snapshot when already resolved is ideal; otherwise skip.
        let regions = [];
        try {
          const foldingModel = contribution._foldingModel || null;
          if (foldingModel && foldingModel.regions) {
            const folded = foldingModel.regions;
            for (let i = 0; i < folded.length; i++) {
              if (typeof folded.isCollapsed === "function" && folded.isCollapsed(i)) {
                regions.push({
                  startLine: Math.max(0, (folded.getStartLineNumber(i) || 1) - 1),
                  endLine: Math.max(0, (folded.getEndLineNumber(i) || 1) - 1),
                });
              }
            }
          }
        } catch (err) {
          regions = [];
        }
        return regions;
      }

      function reportFolds() {
        if (applyingExternal || !currentPath) {
          return;
        }
        if (foldsTimer) {
          clearTimeout(foldsTimer);
        }
        foldsTimer = setTimeout(function () {
          ipc({
            type: "folds",
            path: currentPath,
            folds: collectFoldedRegions(),
          });
        }, 80);
      }

      function applyFoldedRegions(folds) {
        if (!editor || !folds || !folds.length) {
          return;
        }
        const contribution = editor.getContribution("editor.contrib.folding");
        if (!contribution || typeof contribution.getFoldingModel !== "function") {
          return;
        }
        contribution.getFoldingModel().then(function (foldingModel) {
          if (!foldingModel || !foldingModel.regions) {
            return;
          }
          applyingExternal = true;
          try {
            const regions = foldingModel.regions;
            const toCollapse = [];
            for (let i = 0; i < regions.length; i++) {
              const start = Math.max(0, (regions.getStartLineNumber(i) || 1) - 1);
              const end = Math.max(0, (regions.getEndLineNumber(i) || 1) - 1);
              for (let f = 0; f < folds.length; f++) {
                if (folds[f].startLine === start && folds[f].endLine === end) {
                  toCollapse.push(i);
                  break;
                }
              }
            }
            if (toCollapse.length && typeof foldingModel.toggleCollapseState === "function") {
              foldingModel.toggleCollapseState(toCollapse);
            } else if (toCollapse.length && typeof foldingModel.setCollapsed === "function") {
              toCollapse.forEach(function (index) {
                foldingModel.setCollapsed(index, true);
              });
            }
          } finally {
            applyingExternal = false;
          }
        }).catch(function () {});
      }

      function applyEditorOptions(minimap, wordWrap, fontSize) {
        if (!editor) {
          return;
        }
        const options = {};
        if (typeof minimap === "boolean") {
          options.minimap = { enabled: minimap };
        }
        if (typeof wordWrap === "boolean") {
          options.wordWrap = wordWrap ? "on" : "off";
        }
        if (typeof fontSize === "number" && fontSize > 0) {
          options.fontSize = fontSize;
        }
        if (Object.keys(options).length) {
          editor.updateOptions(options);
        }
      }

      function lspRequest(method, extra) {
        const id = nextRequestId++;
        return new Promise(function (resolve) {
          pending[id] = resolve;
          ipc(Object.assign({
            type: "lsp",
            id: id,
            method: method,
            path: currentPath,
          }, extra || {}));
          setTimeout(function () {
            if (pending[id]) {
              delete pending[id];
              resolve(null);
            }
          }, 8000);
        });
      }

      require.config({ paths: { vs: "./vs" } });
      require(["vs/editor/editor.main"], function () {
        editor = monaco.editor.create(document.getElementById("container"), {
          value: "",
          language: "plaintext",
          theme: "vs",
          automaticLayout: true,
          lineNumbers: "on",
          minimap: { enabled: true },
          wordWrap: "off",
          multiCursorModifier: "alt",
          fontSize: 13,
          fontFamily: "Menlo, Monaco, 'Courier New', monospace",
          renderWhitespace: "selection",
          scrollBeyondLastLine: false,
          padding: { top: 4, bottom: 4 },
          overviewRulerLanes: 0,
          hideCursorInOverviewRuler: true,
          overviewRulerBorder: false,
          find: {
            addExtraSpaceOnTop: false,
            autoFindInSelection: "never",
            seedSearchStringFromSelection: "always",
          },
        });

        monaco.languages.registerHoverProvider("*", {
          provideHover: function (model, position) {
            if (!currentPath) {
              return null;
            }
            return lspRequest("hover", {
              line: position.lineNumber - 1,
              character: position.column - 1,
            }).then(function (result) {
              if (!result || !result.contents) {
                return null;
              }
              return {
                contents: [{ value: result.contents }],
                range: result.range ? {
                  startLineNumber: result.range.start.line + 1,
                  startColumn: result.range.start.character + 1,
                  endLineNumber: result.range.end.line + 1,
                  endColumn: result.range.end.character + 1,
                } : undefined,
              };
            });
          },
        });

        monaco.languages.registerCompletionItemProvider("*", {
          triggerCharacters: [".", ":"],
          provideCompletionItems: function (model, position) {
            if (!currentPath) {
              return { suggestions: [] };
            }
            return lspRequest("completion", {
              line: position.lineNumber - 1,
              character: position.column - 1,
            }).then(function (result) {
              const items = (result && result.items) || [];
              const word = model.getWordUntilPosition(position);
              const range = {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: word.startColumn,
                endColumn: word.endColumn,
              };
              return {
                suggestions: items.map(function (item) {
                  return {
                    label: item.label,
                    kind: monaco.languages.CompletionItemKind.Function,
                    detail: item.detail || undefined,
                    insertText: item.insertText || item.label,
                    range: range,
                  };
                }),
              };
            });
          },
        });

        monaco.languages.registerDefinitionProvider("*", {
          provideDefinition: function (model, position) {
            if (!currentPath) {
              return null;
            }
            return lspRequest("definition", {
              line: position.lineNumber - 1,
              character: position.column - 1,
            }).then(function (result) {
              const locs = (result && result.locations) || [];
              return locs.map(function (loc) {
                return {
                  uri: model.uri,
                  range: {
                    startLineNumber: loc.range.start.line + 1,
                    startColumn: loc.range.start.character + 1,
                    endLineNumber: loc.range.end.line + 1,
                    endColumn: loc.range.end.character + 1,
                  },
                };
              });
            });
          },
        });

        monaco.languages.registerReferenceProvider("*", {
          provideReferences: function (model, position) {
            if (!currentPath) {
              return [];
            }
            return lspRequest("references", {
              line: position.lineNumber - 1,
              character: position.column - 1,
            }).then(function (result) {
              const locs = (result && result.locations) || [];
              return locs.map(function (loc) {
                return {
                  uri: model.uri,
                  range: {
                    startLineNumber: loc.range.start.line + 1,
                    startColumn: loc.range.start.character + 1,
                    endLineNumber: loc.range.end.line + 1,
                    endColumn: loc.range.end.character + 1,
                  },
                };
              });
            });
          },
        });

        monaco.languages.registerRenameProvider("*", {
          provideRenameEdits: function (model, position, newName) {
            if (!currentPath) {
              return null;
            }
            return lspRequest("rename", {
              line: position.lineNumber - 1,
              character: position.column - 1,
              newName: newName,
            }).then(function (result) {
              const edits = (result && result.edits) || [];
              return {
                edits: edits.map(function (edit) {
                  return {
                    resource: model.uri,
                    textEdit: {
                      range: {
                        startLineNumber: edit.range.start.line + 1,
                        startColumn: edit.range.start.character + 1,
                        endLineNumber: edit.range.end.line + 1,
                        endColumn: edit.range.end.character + 1,
                      },
                      text: edit.newText,
                    },
                  };
                }),
              };
            });
          },
        });

        editor.onDidChangeModelContent(function () {
          if (applyingExternal || !currentPath) {
            return;
          }
          ipc({
            type: "change",
            path: currentPath,
            content: editor.getValue(),
          });
        });

        editor.onDidScrollChange(function (event) {
          if (!currentPath) {
            return;
          }
          if (scrollTimer) {
            clearTimeout(scrollTimer);
          }
          scrollTimer = setTimeout(function () {
            ipc({
              type: "scroll",
              path: currentPath,
              offset: event.scrollTop || 0,
            });
          }, 50);
        });

        editor.onDidChangeCursorPosition(function (event) {
          if (applyingExternal || !currentPath) {
            return;
          }
          if (cursorTimer) {
            clearTimeout(cursorTimer);
          }
          cursorTimer = setTimeout(function () {
            const position = event.position || editor.getPosition();
            if (!position) {
              return;
            }
            ipc({
              type: "cursor",
              path: currentPath,
              line: Math.max(0, (position.lineNumber || 1) - 1),
              column: Math.max(0, (position.column || 1) - 1),
            });
          }, 50);
        });

        // Fold changes are reported opportunistically after cursor/scroll settles
        // and when Monaco fires hidden-area updates.
        editor.onDidChangeHiddenAreas(function () {
          reportFolds();
        });

        window.addEventListener("keydown", function (event) {
          const meta = event.metaKey || event.ctrlKey;
          if (meta && String(event.key).toLowerCase() === "s") {
            event.preventDefault();
            ipc({ type: "save", path: currentPath });
          }
        });

        ipc({ type: "ready" });
      });

      window.__jaymiSetDocument = function (
        path,
        content,
        language,
        minimap,
        wordWrap,
        fontSize,
        scrollTop,
        cursorLine,
        cursorColumn,
        folds
      ) {
        if (!editor) {
          return;
        }
        applyingExternal = true;
        const pathChanged = currentPath !== (path || "");
        currentPath = path || "";
        const model = editor.getModel();
        if (model) {
          monaco.editor.setModelLanguage(model, language || "plaintext");
          if (model.getValue() !== content) {
            model.setValue(content || "");
          }
        }
        applyEditorOptions(minimap, wordWrap, fontSize);
        if (typeof scrollTop === "number") {
          editor.setScrollTop(scrollTop);
        }
        if (pathChanged || typeof cursorLine === "number") {
          const line = (typeof cursorLine === "number" ? cursorLine : 0) + 1;
          const column = (typeof cursorColumn === "number" ? cursorColumn : 0) + 1;
          editor.setPosition({ lineNumber: line, column: column });
          editor.revealPositionInCenterIfOutsideViewport({
            lineNumber: line,
            column: column,
          });
        }
        applyingExternal = false;
        if (folds && folds.length) {
          setTimeout(function () {
            applyFoldedRegions(folds);
          }, 30);
        }
      };

      window.__jaymiSetOptions = function (options) {
        options = options || {};
        applyEditorOptions(options.minimap, options.wordWrap, options.fontSize);
      };

      window.__jaymiSetTheme = function (name, definition) {
        if (!monaco || !monaco.editor) {
          return;
        }
        if (definition && typeof definition === "object") {
          monaco.editor.defineTheme(name, definition);
          var bg =
            (definition.colors && definition.colors["editor.background"]) ||
            "transparent";
          document.documentElement.style.background = bg;
          document.body.style.background = bg;
          var container = document.getElementById("container");
          if (container) {
            container.style.background = bg;
          }
        }
        monaco.editor.setTheme(name);
      };

      window.__jaymiSetMinimap = function (enabled) {
        applyEditorOptions(!!enabled, null, null);
      };

      window.__jaymiFocus = function () {
        if (editor) {
          editor.focus();
        }
      };

      window.__jaymiLspResult = function (id, payload) {
        const resolve = pending[id];
        if (resolve) {
          delete pending[id];
          resolve(payload || null);
        }
      };

      window.__jaymiSetDiagnostics = function (markers) {
        if (!editor) {
          return;
        }
        const model = editor.getModel();
        if (!model) {
          return;
        }
        const mapped = (markers || []).map(function (marker) {
          const severity = marker.severity === "error"
            ? monaco.MarkerSeverity.Error
            : marker.severity === "warning"
              ? monaco.MarkerSeverity.Warning
              : marker.severity === "info"
                ? monaco.MarkerSeverity.Info
                : monaco.MarkerSeverity.Hint;
          return {
            severity: severity,
            message: marker.message || "",
            startLineNumber: (marker.line || 0) + 1,
            startColumn: (marker.character || 0) + 1,
            endLineNumber: (marker.endLine != null ? marker.endLine : marker.line || 0) + 1,
            endColumn: (marker.endCharacter != null ? marker.endCharacter : (marker.character || 0) + 1) + 1,
          };
        });
        monaco.editor.setModelMarkers(model, "jaymi-lsp", mapped);
      };
    })();
  </script>
</body>
</html>
